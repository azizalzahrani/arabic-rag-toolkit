# AZION OS · keep dependencies visible.
#
# Corrected on 16 August 2026. The first version of this file declared an npm
# project at the repository root in every repository it was installed into.
# In this one there is no package.json at the root, so every Dependabot run
# failed with "/package.json not found" and the default branch read red for a
# reason that had nothing to do with the code.
#
# A red branch that means nothing is worse than no signal at all, because it
# trains you to ignore the colour.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule: { interval: "weekly", day: "sunday", time: "04:00", timezone: "Asia/Riyadh" }
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
    labels: ["dependencies"]
