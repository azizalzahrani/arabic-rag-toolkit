# AZION OS · keep dependencies visible.
#
# Twelve of fourteen active repositories had alerts switched off on 15 August
# 2026, which meant "0 alerts" read as clean when it actually meant unwatched.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly", day: "sunday", time: "04:00", timezone: "Asia/Riyadh" }
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
    labels: ["dependencies"]
